function wireSeccionEventos(r, target){
  const set = getEvalSet(r, target);

  document.querySelectorAll(`[data-clearhora][data-target="${target}"]`).forEach(btn=>{
    btn.onclick = ()=>{
      const row = set.arr.find(e=>e.id===btn.dataset.clearhora);
      if(row){ row.hora=''; persist(); render(); }
    };
  });

  // Campos de cualquier fila (individual o dentro de un grupo)
  document.querySelectorAll(`[data-rowfield][data-target="${target}"]`).forEach(input=>{
    const field = input.dataset.rowfield;
    input.addEventListener('focus', ()=> input.select());
    input.addEventListener('blur', ()=>{
      const row = set.arr.find(e=>e.id===input.dataset.rowid);
      if(!row) return;
      if(field==='tipo'){
        row.tipo = input.value;
        row.tipoSuggested = false;
        row.tipoAuto = false;
        const prefix = parsePrefix1(input.value);
        if(prefix!==null){
          const grp = getGroupOfRow(set.grupos, row.id);
          if(grp){
            const filas = grp.rowIds.map(id=>set.arr.find(e=>e.id===id)).filter(Boolean);
            const idx = filas.indexOf(row);
            autocompleteTipo(filas, idx, prefix);
          }
        }
      } else if(field==='nota'){
        row.nota = parseNota(input.value) || (input.value.trim()==='' ? '-' : input.value);
      } else if(field==='sala'){
        row.sala = input.value.trim()==='' ? '-' : input.value;
      } else if(field==='porcentaje'){
        row.porcentaje = input.value.trim()==='' ? '' : truncarDecimal(input.value);
      } else if(field==='fecha'){
        row.fecha = input.value;
      } else if(field==='hora'){
        row.hora = input.value;
      }
      persist(); render();
    });
  });

  // Eliminar una fila de la tabla de evaluaciones sueltas
  document.querySelectorAll(`[data-inddel][data-target="${target}"]`).forEach(btn=>{
    btn.onclick = ()=>{
      if(!confirm('¿Eliminar esta evaluación?')) return;
      set.arr = set.arr.filter(e=> e.id !== btn.dataset.inddel);
      if(target==='lab'){ r.evaluacionesLab = set.arr; } else { r.evaluaciones = set.arr; }
      persist(); render();
    };
  });

  // Botones agregar
  const nuevaFilaSuelta = ()=>{
    set.arr.push({id:uid(), tipo:'', nota:'', porcentaje:'', fecha:'', hora:'', sala:'', excluida:false});
    if(target==='lab'){ r.evaluacionesLab = set.arr; } else { r.evaluaciones = set.arr; }
    persist(); render();
  };
  const crearIndBtn = document.querySelector(`[data-crearindividuales="${target}"]`);
  if(crearIndBtn) crearIndBtn.onclick = nuevaFilaSuelta;
  const addIndBtn = document.querySelector(`[data-addindividual="${target}"]`);
  if(addIndBtn) addIndBtn.onclick = nuevaFilaSuelta;

  const addGrupoBtn = document.querySelector(`[data-addgrupo="${target}"]`);
  if(addGrupoBtn){
    addGrupoBtn.onclick = ()=>{
      const nextNum = set.grupos.length+1;
      const grupo = {id:uid(), nombre:'Grupo '+nextNum, rowIds:[], repartirActivo:true, descartarPeor:false, porcentajeTotal:0};
      set.grupos.push(grupo);
      // El grupo nace con una fila lista para escribir
      agregarEvalAGrupo(set, grupo);
      if(target==='lab'){ r.gruposEvalLab = set.grupos; r.evaluacionesLab = set.arr; }
      else { r.gruposEval = set.grupos; r.evaluaciones = set.arr; }
      persist(); render();
    };
  }

  // Nombre y % del grupo
  document.querySelectorAll(`[data-gruponombre][data-target="${target}"]`).forEach(input=>{
    input.addEventListener('blur', ()=>{
      const grupo = set.grupos.find(g=>g.id===input.dataset.gruponombre);
      if(grupo){ grupo.nombre = input.value.trim() || grupo.nombre; persist(); render(); }
    });
  });
  document.querySelectorAll(`[data-grupopeso][data-target="${target}"]`).forEach(input=>{
    input.addEventListener('blur', ()=>{
      const grupo = set.grupos.find(g=>g.id===input.dataset.grupopeso);
      if(grupo){ grupo.porcentajeTotal = truncarDecimal(input.value)||0; persist(); render(); }
    });
  });

  // Switch "distribuir % en partes iguales"
  document.querySelectorAll(`[data-grupotoggledist][data-target="${target}"]`).forEach(t=>{
    t.onclick = ()=>{
      const grupo = set.grupos.find(g=>g.id===t.dataset.grupotoggledist);
      if(!grupo) return;
      grupo.repartirActivo = !grupo.repartirActivo;
      if(!grupo.repartirActivo && grupo.descartarPeor){
        grupo.descartarPeor = false;
        toast('"Descartar peor nota" se desactivó: requiere reparto en partes iguales');
      }
      persist(); render();
    };
  });

  // Switch "descartar peor nota" (bloqueado si no hay reparto igual activo)
  document.querySelectorAll(`[data-grupotoggledescartar][data-target="${target}"]`).forEach(t=>{
    t.onclick = ()=>{
      const grupo = set.grupos.find(g=>g.id===t.dataset.grupotoggledescartar);
      if(!grupo) return;
      if(!grupo.repartirActivo){
        toast('Activa "Distribuir % en partes iguales" para poder descartar la peor nota');
        return;
      }
      grupo.descartarPeor = !grupo.descartarPeor;
      persist(); render();
    };
  });

  // Eliminar grupo (y sus evaluaciones)
  document.querySelectorAll(`[data-grupodel][data-target="${target}"]`).forEach(btn=>{
    btn.onclick = ()=>{
      const grupo = set.grupos.find(g=>g.id===btn.dataset.grupodel);
      if(!grupo) return;
      if(!confirm('¿Eliminar este grupo y todas sus evaluaciones?')) return;
      set.arr = set.arr.filter(e=> !grupo.rowIds.includes(e.id));
      set.grupos = set.grupos.filter(g=> g.id !== grupo.id);
      if(target==='lab'){ r.evaluacionesLab = set.arr; r.gruposEvalLab = set.grupos; }
      else { r.evaluaciones = set.arr; r.gruposEval = set.grupos; }
      persist(); render();
    };
  });

  // Agregar evaluación a un grupo (con auto-numeración)
  document.querySelectorAll(`[data-addevalgrupo][data-target="${target}"]`).forEach(btn=>{
    btn.onclick = ()=>{
      const grupo = set.grupos.find(g=>g.id===btn.dataset.addevalgrupo);
      if(!grupo) return;
      agregarEvalAGrupo(set, grupo);
      if(target==='lab'){ r.evaluacionesLab = set.arr; } else { r.evaluaciones = set.arr; }
      persist(); render();
    };
  });
}

        r.separarLab = !r.separarLab;
        if(r.separarLab){
          r.ponderacionTeoria = r.ponderacionTeoria ?? 50;
          r.ponderacionLab = r.ponderacionLab ?? 50;
          r.evaluacionesLab = r.evaluacionesLab || [];
          r.gruposEvalLab = r.gruposEvalLab || [];
        }
        persist(); render();
      };
    }

    const pondT = document.getElementById('pondTeoriaInput');
    const pondL = document.getElementById('pondLabInput');
    if(pondT && pondL){
      pondT.addEventListener('input', ()=>{
        let v = parseFloat(pondT.value); if(isNaN(v)) v=0; v=Math.max(0,Math.min(100,v));
        r.ponderacionTeoria = v; r.ponderacionLab = 100-v;
        pondL.value = r.ponderacionLab;
        persist();
      });
      pondL.addEventListener('input', ()=>{
        let v = parseFloat(pondL.value); if(isNaN(v)) v=0; v=Math.max(0,Math.min(100,v));
        r.ponderacionLab = v; r.ponderacionTeoria = 100-v;
        pondT.value = r.ponderacionTeoria;
        persist();
      });
    }

    wireSeccionEventos(r, 'teoria');
    if(r.separarLab) wireSeccionEventos(r, 'lab');

    const guardarBtn = document.getElementById('guardarEval');
    if(guardarBtn){
      guardarBtn.onclick = ()=>{
        let msgs = [];
        if(r.evaluaciones && r.evaluaciones.length){
          const suma = r.evaluaciones.reduce((s,row)=> row.excluida ? s : s + (parseFloat(row.porcentaje)||0), 0);
          if(Math.round(suma) !== 100) msgs.push(`Teoría: los porcentajes suman ${formatPorcentaje(suma)}% (deben sumar 100%).`);
        }
        if(r.separarLab && r.evaluacionesLab && r.evaluacionesLab.length){
          const sumaLab = r.evaluacionesLab.reduce((s,row)=> row.excluida ? s : s + (parseFloat(row.porcentaje)||0), 0);
          if(Math.round(sumaLab) !== 100) msgs.push(`Laboratorio: los porcentajes suman ${formatPorcentaje(sumaLab)}% (deben sumar 100%).`);
        }
        const warnDiv = document.getElementById('evalWarn');
        if(msgs.length){
          if(warnDiv) warnDiv.innerHTML = `<div class="warn">${msgs.join('<br>')}</div>`;
        } else {
          if(warnDiv) warnDiv.innerHTML = '';
          persist(); toast('Evaluaciones guardadas'); state.view='detail'; render();
        }
      };
    }
  }

  if(state.view==='semana'){
    document.querySelector('[data-back]').onclick = ()=>{ state.view='detail'; render(); };
    const r = getRamo();
    if(!r.nSemana){
      document.getElementById('crearSemTabla').onclick = ()=>{
        const n = parseInt(document.getElementById('nSemInput').value,10);
        if(!n || n<1){ toast('Ingresa un número válido'); return; }
        r.nSemana = n;
        r.sesiones = Array.from({length:n}, ()=>({dia:'',bloque:'1',ubicacion:'',tipo:'T'}));
        persist(); render();
      };
      return;
    }
    document.querySelectorAll('#semBody tr').forEach(tr=>{
      const i = parseInt(tr.dataset.row,10);
      tr.querySelectorAll('input,select').forEach(input=>{
        const field = input.dataset.field;
        if(input.tagName==='INPUT'){
          input.addEventListener('focus', ()=> input.select());
        }
        input.addEventListener('blur', ()=>{
          const row = r.sesiones[i];
          if(field==='ubicacion'){
            row.ubicacion = input.value;
            row.ubicacionSuggested = false;
            const prefix = parseUbicacionPrefix(input.value);
            if(prefix) autocompleteUbicacion(r, i, prefix);
          } else if(field==='bloque'){
            const nuevoBloque = input.value || '1';
            const conflicto = row.dia ? bloqueOcupadoPor(row.dia, nuevoBloque, r.id, i) : null;
            if(conflicto){
              toast(`Ese bloque ya está ocupado por ${conflicto}`);
              render();
              return;
            }
            row.bloque = nuevoBloque;
          } else if(field==='dia'){
            const nuevoDia = input.value;
            const conflicto = nuevoDia ? bloqueOcupadoPor(nuevoDia, row.bloque, r.id, i) : null;
            if(conflicto){
              toast(`Ese bloque ya está ocupado por ${conflicto}`);
              render();
              return;
            }
            row.dia = nuevoDia;
          } else if(field==='tipo'){
            row.tipo = input.value;
          }
          persist(); render();
        });
        if(input.tagName==='SELECT'){
          input.addEventListener('change', ()=> input.blur());
        }
      });
    });
    document.getElementById('cambiarNSem').onclick = ()=>{
      const n = parseInt(prompt('Nueva cantidad a la semana:', r.nSemana),10);
      if(!n || n<1) return;
      const nuevo = Array.from({length:n}, (_,i)=> r.sesiones[i] || {dia:'',bloque:'1',ubicacion:'',tipo:'T'});
      r.nSemana = n; r.sesiones = nuevo; persist(); render();
    };
    document.getElementById('guardarSem').onclick = ()=>{
      persist(); toast('Horario guardado'); state.view='detail'; render();
    };
  }

  if(state.view==='info'){
    document.querySelector('[data-back]').onclick = ()=>{ state.view='detail'; render(); };
    const rInfo = getRamo();
    const profInput = document.getElementById('profInput');
    const correoInput = document.getElementById('correoInput');
    // Se sugiere el correo a partir del nombre, mientras no lo hayas editado tú
    if(!correoInput.value && profInput.value){
      correoInput.value = correoDesdeProfesor(profInput.value);
    }
    profInput.addEventListener('input', ()=>{
      const pos = profInput.selectionStart;
      const capitalizado = capitalizarNombre(profInput.value);
      if(capitalizado !== profInput.value){
        profInput.value = capitalizado;
        profInput.setSelectionRange(pos, pos);
      }
      if(!rInfo.correoManual) correoInput.value = correoDesdeProfesor(profInput.value);
    });
    correoInput.addEventListener('input', ()=>{
      rInfo.correoManual = correoInput.value.trim() !== correoDesdeProfesor(profInput.value);
    });
    document.getElementById('guardarInfo').onclick = ()=>{
      const r = getRamo();
      r.profesor = capitalizarNombre(profInput.value.trim());
      r.seccion = document.getElementById('seccInput').value.trim();
      const seccLab = document.getElementById('seccLabInput');
      if(seccLab) r.seccionLab = seccLab.value.trim();
      r.correo = correoInput.value.trim();
      persist(); toast('Información guardada'); state.view='detail'; render();
    };
  }
}

renderNavOnce();
render();
</script>
</body>
</html>
